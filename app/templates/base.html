<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}肿瘤变异位点比对{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
           margin: 0; background: #f5f6f8; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 14px 24px; }
    header a { color: #fff; text-decoration: none; }
    header h1 { font-size: 18px; margin: 0; display: inline-block; }
    header nav { display: inline-block; margin-left: 24px; font-size: 14px; }
    header nav a { margin-right: 14px; text-decoration: underline; }
    main { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e2e5ea; border-radius: 8px;
            padding: 18px 20px; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #e2e5ea; padding: 6px 10px; text-align: left; }
    th { background: #f0f2f5; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px;
             font-size: 12px; color: #fff; }
    .ok { background: #2e7d32; }
    .fail { background: #c62828; }
    .error-box { background: #fdecea; border: 1px solid #f5c6c0; color: #8c1d18;
                 padding: 12px 14px; border-radius: 6px; white-space: pre-wrap; }
    .meta dt { font-weight: 600; float: left; width: 130px; clear: left; }
    .meta dd { margin: 0 0 6px 140px; }
    input[type=file] { margin: 4px 0; }
    button { background: #1f3a5f; color: #fff; border: 0; border-radius: 6px;
             padding: 9px 22px; font-size: 15px; cursor: pointer; }
    button:hover { background: #2a4f80; }
    .muted { color: #777; font-size: 13px; }
    h2 { font-size: 17px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">肿瘤变异位点比对</a></h1>
    <nav><a href="/">比对</a><a href="/migrate">坐标迁移</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
